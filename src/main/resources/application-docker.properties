# ============================================
# CONFIGURACION PARA ENTORNO DOCKER
# ============================================

# ============================================
# CONFIGURACION DE JPA/HIBERNATE
# ============================================
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO}
spring.jpa.show-sql=${JPA_SHOW_SQL}
spring.jpa.properties.hibernate.format_sql=${HIBERNATE_FORMAT_SQL}

# ============================================
# CONFIGURACION DEL SEEDER
# ============================================
seed.enabled=${SEED_ENABLED}

# ============================================
# CONFIGURACION DE LOGGING
# ============================================
logging.level.root=${LOG_LEVEL_ROOT}
logging.level.com.ondra.users=${LOG_LEVEL_APP}
logging.level.org.springframework.web=${LOG_LEVEL_WEB}
logging.level.org.springframework.security=${LOG_LEVEL_SECURITY}
logging.level.org.hibernate.SQL=${LOG_LEVEL_SQL}
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=${LOG_LEVEL_SQL_BINDER}